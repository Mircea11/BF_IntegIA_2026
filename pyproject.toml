[project]
name = "bf-integia-2026"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docling>=2.94",
    "dotenv==0.9.9",
    "duckdb>=1.5.5",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "jupyterlab>=4.6.2",
    "matplotlib>=3.11.1",
    "notebook>=7.6.1",
    "numpy>=2.5.1",
    "openai>=3.26.0",
    "pandas>=3.0.5",
    "polars>=1.43.2",
    "psycopg2-binary==2.9.12",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=25.0.1",
    "pymupdf>=1.28.2",
    "python-dotenv==1.2.2",
    "qdrant-client>=1.19.1",
    "seaborn>=0.13.2",
    "sqlalchemy==2.0.49",
    "transformers>=5.19.0",
    "typing-extensions==4.15.0",
]

[project.scripts]
bf-integia-2026 = "bf_integia_2026:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "Specialist_IA/Polars",
    "dataframes_polars",
    "formation/vLLM/vllm_server",
    "formation/vLLM/full_llama_vllm/cours-rag",
    "RAG/cours-rag",
]
