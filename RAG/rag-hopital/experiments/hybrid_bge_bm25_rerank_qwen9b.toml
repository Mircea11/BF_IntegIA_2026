# E11 — Hybrid Search + BGE Reranker

name = "hybrid_bge_bm25_rerank_qwen9b_v1"
dataset = "hopital_eval.json"

[chunking]
max_tokens = 512
patient_line = true
overlap = 0

[embedder]
model = "bge-m3"

[search]
method = "hybrid"
collection = "hopital_bge_m3_512_hybrid"
sparse_model = "Qdrant/bm25"
sparse_language = "french"
fusion = "rrf"
top_k = 5
candidates = 30

[reranker]
enabled = true
model = "BAAI/bge-reranker-v2-m3"
device = "cpu"

[generation]
enabled = true
model = "qwen3.5-9b"
#system_prompt = "references/RagRecapCorrige/prompts/detailed.txt"
system_prompt = "prompts/baseline_detailed_v1.txt"
temperature = 0.0
max_tokens = 400
reasoning = false