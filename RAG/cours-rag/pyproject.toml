[project]
name = "cours-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mircea Bordeianu~", email = "m.bordeianu@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "docling>=2.94",
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.2",
    "openai>=3.26.0",
    "polars>=1.43.2",
    "psycopg[binary]>=3.3.6",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.19.1",
    "transformers>=5.19.0",
]

[project.scripts]
cours-rag = "cours_rag:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
