services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    volumes:
      # docker exec ollama ollama pull qwen3:0.6b
      - ollama:/root/.ollama
    ports:
      - "11434:11434"
        # GPU NVIDIA : décommenter ce bloc (nécessite nvidia-container-toolkit)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_AUTH=false
    volumes:
      - openwebui:/app/backend/data
    depends_on:
      - ollama
    restart: unless-stopped


volumes:
  ollama:
  openwebui: